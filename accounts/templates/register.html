{% extends "base.html" %}
{% block content %}
<div class="bg-gray-900 flex justify-center items-center w-screen h-screen p-5">
  <div
    class="bg-white shadow-md rounded px-8 pt-6 pb-8 mb-4 flex flex-col w-full md:w-1/3"
  >
    <h1 class="text-2xl font-bold mb-4 text-center text-gray-900">
      Register Now
    </h1>
    {% if error %}
    <p style="color: red">{{ error }}</p>
    {% endif %}
    <form method="post">
      {% csrf_token %}
      <div class="mb-4">
        <label class="block text-gray-900 text-sm font-bold mb-2">
          First Name <span class="text-red-500">*</span>
        </label>
        <input
          class="shadow appearance-none border rounded-md w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline border border-gray-800"
          name="first_name"
          type="text"
          placeholder="First Name"
        />
        <label class="block text-gray-900 text-sm font-bold mb-2">
          Last Name <span class="text-red-500">*</span>
        </label>
        <input
          class="shadow appearance-none border rounded-md w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline border border-gray-800"
          name="last_name"
          type="text"
          placeholder="Last Name"
        />
        <label class="block text-gray-900 text-sm font-bold mb-2">
          Email <span class="text-red-500">*</span>
        </label>
        <input
          class="shadow appearance-none border rounded-md w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline border border-gray-800"
          name="email"
          type="email"
          placeholder="Email"
        />
      </div>
      <div class="mb-6">
        <label class="block text-gray-900 text-sm font-bold mb-2">
          Password <span class="text-red-500">*</span>
        </label>
        <input
          class="shadow appearance-none border border-red-500 rounded-md w-full py-2 px-3 text-gray-700 mb-3 leading-tight focus:outline-none focus:shadow-outline border border-gray-700"
          name="password"
          type="password"
          placeholder="******************"
        />
      </div>
      <div class="flex items-center justify-between">
        <button
          class="bg-green-500 hover:bg-green-700 text-white w-full font-bold py-2 px-4 rounded focus:outline-none focus:shadow-outline dark:bg-green-600"
          type="submit"
        >
          Login
        </button>
      </div>
    </form>
    <a href="{% url 'login' %}" class='text-center text-blue-400 font-bold text-xs curser-pointer mt-5'>Already Have a Account Login Now </a>
  </div>
</div>
{% endblock  %}
